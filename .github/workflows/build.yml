name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the installer to a release on version tags

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install libpcap (for the capture test)
        run: sudo apt-get install -y libpcap0.8
      - name: Unit tests
        run: dotnet run --project tests/CameraFinder.Core.Tests -c Release -- --unit-only
      - name: Live bandwidth and ffprobe against a real RTSP server (mediamtx + ffmpeg, digest and basic login)
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg
          for auth in digest basic; do
            bash tools/rtsp-test-server.sh "$RUNNER_TEMP/rtsp" "$auth"
            RTSP_TEST_URL=rtsp://127.0.0.1:8554/cam RTSP_TEST_AUTH=$auth \
              dotnet tests/CameraFinder.Core.Tests/bin/Release/net8.0/CameraFinder.Core.Tests.dll --unit-only | tee "$RUNNER_TEMP/out-$auth.txt"
            kill $(cat "$RUNNER_TEMP/rtsp/pids") || true
            sleep 1
            grep -q "PASS TestLiveBandwidthAgainstARealRtspServer" "$RUNNER_TEMP/out-$auth.txt" || { cat "$RUNNER_TEMP/rtsp/"*.log; exit 1; }
          done

      - name: SNMP client against a real agent (net-snmp snmpd)
        run: |
          sudo apt-get install -y --no-install-recommends snmpd
          printf 'agentaddress udp:127.0.0.1:1161\nrocommunity public 127.0.0.1\n' > "$RUNNER_TEMP/snmpd.conf"
          sudo snmpd -C -c "$RUNNER_TEMP/snmpd.conf" -Lf "$RUNNER_TEMP/snmpd.log" -p "$RUNNER_TEMP/snmpd.pid"
          sleep 2
          SNMP_TEST_AGENT=127.0.0.1:1161 dotnet tests/CameraFinder.Core.Tests/bin/Release/net8.0/CameraFinder.Core.Tests.dll --unit-only | tee "$RUNNER_TEMP/out-snmp.txt"
          sudo kill $(cat "$RUNNER_TEMP/snmpd.pid") || true
          grep -q "PASS TestSnmpAgainstARealAgent" "$RUNNER_TEMP/out-snmp.txt" || { cat "$RUNNER_TEMP/snmpd.log"; exit 1; }

      - name: Live network tests (fake camera on this machine)
        # Need raw capture and port 80, so run as root. Hosted runners may restrict multicast, so don't fail the build.
        continue-on-error: true
        run: sudo $(which dotnet) tests/CameraFinder.Core.Tests/bin/Release/net8.0/CameraFinder.Core.Tests.dll

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Unit tests
        run: dotnet run --project tests/CameraFinder.Core.Tests -c Release -- --unit-only

      - name: Real Windows network changes (virtual IP, web session, one-device route, crash clean-up)
        env:
          NETSH_TEST: "1"
        run: |
          dotnet run --project tests/CameraFinder.Core.Tests -c Release -- --only TestRealWindowsVirtualIpAndWebSession | Tee-Object -FilePath netsh.txt
          if (-not (Select-String -Path netsh.txt -Pattern "PASS TestRealWindowsVirtualIpAndWebSession" -Quiet)) { exit 1 }

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = '0.1.0'
          if ('${{ github.ref_type }}' -eq 'tag') { $v = '${{ github.ref_name }}'.TrimStart('v') }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish self-contained exe
        run: >
          dotnet publish src/CameraFinder.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.ver.outputs.version }} -o publish

      - name: UI smoke test (demo run, screenshots of every window)
        # Runs the app's hidden --screenshot mode on the demo site in both themes. Fails the build if a window throws.
        shell: pwsh
        run: |
          foreach ($theme in 'light', 'dark') {
            $env:CAMERAFINDER_THEME = $theme
            $p = Start-Process publish\CameraFinder.exe -ArgumentList '--screenshot', "$pwd\shots" -PassThru
            if (-not $p.WaitForExit(240000)) { $p.Kill(); throw "UI smoke test ($theme) did not finish in 4 minutes" }
          }
          Get-ChildItem shots | Format-Table Name, Length
          if (Test-Path shots\*error*.txt) { Get-Content shots\*error*.txt; throw "UI errors during the smoke test" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots
          if-no-files-found: ignore

      - name: Bundle ffprobe and iperf3 (hash-checked)
        shell: pwsh
        run: ./tools/fetch-tools.ps1 -Destination publish/tools

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc /DAppVersion=${{ steps.ver.outputs.version }} /DSourceDir=..\publish installer\CameraFinder.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: CameraFinder-${{ steps.ver.outputs.version }}
          path: |
            dist/*.exe
            publish/CameraFinder.exe

      - name: Fixed-name copy for the README "latest" download link
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: Copy-Item "dist/CameraFinder-Setup-$env:APP_VERSION.exe" "dist/CameraFinder-Setup.exe"

      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
